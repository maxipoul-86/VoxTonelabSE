<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tone AI</title>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2C27A"/>
      <stop offset="0.55" stop-color="#C8A04B"/>
      <stop offset="1" stop-color="#9C7A32"/>
    </linearGradient>
    <radialGradient id="bakelite" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3A3A38"/>
      <stop offset="1" stop-color="#121211"/>
    </radialGradient>
  </defs>

  <!-- Plate -->
  <rect x="0" y="0" width="900" height="320" rx="28" fill="#1F3A2E"/>
  <rect x="14" y="14" width="872" height="292" rx="18" fill="none" stroke="url(#brass)" stroke-width="3"/>

  <!-- Knob emblem -->
  <g transform="translate(165 160)">
    <circle r="104" fill="#18302A" stroke="url(#brass)" stroke-width="4"/>
    <!-- Sweep dots, 7 to 5 o'clock -->
    <g fill="#EDE3CC">
      <circle r="4.5" transform="rotate(-135) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(-108) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(-81) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(-54) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(-27) translate(0 -86)"/>
      <circle r="6" fill="url(#brass)" transform="rotate(0) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(27) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(54) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(81) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(108) translate(0 -86)"/>
      <circle r="4.5" transform="rotate(135) translate(0 -86)"/>
    </g>
    <!-- Chicken-head knob, turned up past noon -->
    <g transform="rotate(38)">
      <ellipse cx="4" cy="6" rx="34" ry="34" fill="#000" opacity="0.35"/>
      <path d="M0 -68 C 9 -66 24 -10 26 6 C 28 24 16 34 0 34 C -16 34 -28 24 -26 6 C -24 -10 -9 -66 0 -68 Z"
            fill="url(#bakelite)" stroke="#000" stroke-width="1.5"/>
      <circle r="17" fill="#232322" stroke="#3E3E3B" stroke-width="2"/>
      <line x1="0" y1="-60" x2="0" y2="-20" stroke="#EDE3CC" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Rockwell, 'Roboto Slab', 'Zilla Slab', 'Courier New', Georgia, serif">
    <text x="312" y="194" font-size="120" font-weight="700" fill="#EDE3CC">Tone AI</text>
    <rect x="315" y="218" width="500" height="3" fill="url(#brass)"/>
  </g>
</svg>
